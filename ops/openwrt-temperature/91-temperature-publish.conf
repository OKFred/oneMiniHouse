# R4S site configuration, separate from the generic LuCI MQTT package.
# Requires collectd-mod-match-regex and collectd-mod-uptime.
# Local RRD statistics still receive all metrics.
# Apply only after verifying rrdtool and mqtt/luci_ui are the only write callbacks.
# collectd 5.12 calls mosquitto_loop only from its write callback. A 20-second
# uptime pulse services PUBACK/PINGRESP before the fixed 60-second keepalive.
# Thermal remains at the configured 60 seconds; ingestor ignores uptime.
<LoadPlugin uptime>
  Interval 20
</LoadPlugin>
LoadPlugin match_regex
PostCacheChain "one_minihouse_temperature"
<Chain "one_minihouse_temperature">
  <Rule "mqtt_thermal_and_liveness">
    <Match "regex">
      Plugin "^(thermal|uptime)$"
      Type "^(temperature|uptime)$"
    </Match>
    <Target "write">
      Plugin "mqtt/luci_ui"
    </Target>
  </Rule>
  <Target "write">
    Plugin "rrdtool"
  </Target>
</Chain>
